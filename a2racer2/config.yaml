name: A2 Racer II
version: "2.0.0"
slug: a2racer2
description: Speel A2 Racer II in de browser via Home Assistant-ingress, met automatische aanraakbediening.
url: https://github.com/MarkvdDr/HomeAssistantApps/tree/main/a2racer2
arch:
  - aarch64
  - amd64
  # Legacy HAOS architectures; still accepted by the Supervisor and covered
  # by the multi-arch nginx image.
  - armhf
  - armv7
  - i386
init: true
startup: application
boot: auto
# The game files live on the Home Assistant host in /share/A2racer2.
# Read-only: the add-on only serves them, saves stay in the browser.
map:
  - share:ro
ingress: true
ingress_port: 8099
panel_icon: mdi:car-sports
panel_title: A2 Racer II
