<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111317">
<title>A2 Racer II</title>
<style>
  :root {
    --bg: #111317; --panel: #1b1e24; --text: #e8e8ea; --muted: #9aa0aa;
    --accent: #e8452c; --border: #2c3038;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text);
               font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
               overscroll-behavior: none; }
  /* SDL sizes its window from the canvas's CSS size. The canvas stays laid out
     behind the panel so the first frame already has the screen's size. */
  #canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
            background: #000; outline: none; touch-action: none;
            user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #overlay { position: fixed; inset: 0; z-index: 2; display: flex; align-items: center;
             justify-content: center; padding: 16px; overflow: auto;
             background: radial-gradient(120% 90% at 50% 0%, #1a1d24 0%, var(--bg) 70%); }
  #overlay.hidden { display: none; }
  #panel { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--border);
           border-radius: 12px; padding: 24px; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .02em; }
  p { margin: 8px 0; color: var(--muted); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  button, label.btn { appearance: none; border: 0; border-radius: 7px; padding: 10px 16px;
                      font: inherit; font-weight: 600; cursor: pointer;
                      background: var(--accent); color: #fff; }
  button.ghost { background: none; color: var(--muted); border: 1px solid var(--border); }
  button:disabled { opacity: .5; cursor: default; }
  input[type=file] { display: none; }
  progress { width: 100%; height: 8px; margin-top: 14px; accent-color: var(--accent); }
  #note { color: var(--text); border-left: 3px solid var(--accent); padding-left: 10px; }
  #message { margin-top: 14px; padding: 10px 12px; border-radius: 7px;
             background: #3a1b17; border: 1px solid #6d2a22; color: #ffd9d2;
             white-space: pre-wrap; cursor: pointer; }
  /* Engine messages while the game is running: the panel is hidden then. */
  #toast { position: fixed; left: 50%; bottom: 16px;
           bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
           z-index: 3; width: min(720px, calc(100vw - 32px)); padding: 12px 14px;
           border-radius: 8px; background: #3a1b17; border: 1px solid #6d2a22;
           color: #ffd9d2; white-space: pre-wrap; cursor: pointer;
           box-shadow: 0 6px 24px rgba(0, 0, 0, .45); }
  #log { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
         white-space: pre-wrap; max-height: 110px; overflow: auto; margin-top: 12px; }
  code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="toast" class="hidden" role="alert"></div>

<div id="overlay">
  <main id="panel">
    <h1>A2 Racer II</h1>
    <p id="status">Starten…</p>
    <p id="note" class="hidden"></p>
    <progress id="progress" class="hidden" max="100" value="0"></progress>
    <div id="pick" class="row hidden">
      <label class="btn" for="folder">Kies de gamemap…</label>
      <input id="folder" type="file" webkitdirectory multiple>
      <button id="server" class="ghost hidden">Gebruik de bestanden op de server</button>
    </div>
    <div id="ready" class="row hidden">
      <button id="play">Spelen</button>
      <button id="fullscreen" class="ghost">Volledig scherm</button>
      <button id="forget" class="ghost">Spelbestanden vergeten</button>
    </div>
    <div id="message" class="hidden"></div>
    <div id="log"></div>
  </main>
</div>

<script src="loader.js"></script>
<script src="a2racer2.js"></script>
</body>
</html>
